name: Windows Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BETTER_AUTH_SECRET: "desktop-local-only-secret"
      NEXT_PUBLIC_SITE_URL: "http://127.0.0.1"
      DATABASE_URL: "postgresql://opencut:opencut@127.0.0.1:5432/opencut"
      UPSTASH_REDIS_REST_URL: "https://placeholder.invalid"
      UPSTASH_REDIS_REST_TOKEN: "desktop-placeholder"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.invalid"
      MARBLE_WORKSPACE_KEY: "desktop-placeholder"
      FREESOUND_CLIENT_ID: "desktop-placeholder"
      FREESOUND_API_KEY: "desktop-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Install Rust WASM target
        shell: pwsh
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install JavaScript dependencies
        shell: pwsh
        # Bun lockfiles may gain Windows-specific optional dependency metadata.
        run: bun install

      - name: Build and link local WASM
        shell: pwsh
        run: bun run setup:ai

      - name: Prepare bundled FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          New-Item -ItemType Directory -Force apps/windows/vendor/ai/bin | Out-Null
          $ffmpegRoot = Join-Path $env:ChocolateyInstall "lib/ffmpeg/tools"
          $ffmpeg = Get-ChildItem $ffmpegRoot -Recurse -File -Filter ffmpeg.exe |
            Where-Object Length -GT 1MB |
            Select-Object -First 1
          $ffprobe = Get-ChildItem $ffmpegRoot -Recurse -File -Filter ffprobe.exe |
            Where-Object Length -GT 1MB |
            Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "Binary FFmpeg asli tidak ditemukan di $ffmpegRoot"
          }
          Copy-Item $ffmpeg.FullName apps/windows/vendor/ai/bin/ffmpeg.exe
          Copy-Item $ffprobe.FullName apps/windows/vendor/ai/bin/ffprobe.exe
          & apps/windows/vendor/ai/bin/ffmpeg.exe -version

      - name: Build bundled whisper.cpp
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.9.2 https://github.com/ggml-org/whisper.cpp.git build/whisper.cpp
          cmake -S build/whisper.cpp -B build/whisper.cpp-build -A x64 -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF
          cmake --build build/whisper.cpp-build --config Release --target whisper-cli
          Copy-Item build/whisper.cpp-build/bin/Release/* apps/windows/vendor/ai/bin/ -Recurse -Force
          & apps/windows/vendor/ai/bin/whisper-cli.exe --version

      - name: Download quantized multilingual Whisper model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/windows/vendor/ai/models | Out-Null
          $modelPath = "apps/windows/vendor/ai/models/ggml-base-q5_1.bin"
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin?download=true" -OutFile $modelPath
          $expectedSha256 = "422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898"
          $actualSha256 = (Get-FileHash $modelPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Checksum model Whisper tidak cocok: $actualSha256"
          }

      - name: Build production web server
        shell: pwsh
        run: bun run build:web

      - name: Package Windows installer and portable app
        shell: pwsh
        working-directory: apps/windows
        run: bun run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenCut-AI-Setup-Windows-x64
          path: apps/windows/dist/OpenCut-AI-Setup-*-x64.exe
          if-no-files-found: error

      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: OpenCut-AI-Portable-Windows-x64
          path: apps/windows/dist/OpenCut-AI-Portable-*-x64.exe
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "windows-v0.1.7" --yes 2>$null
          gh release delete "windows-v0.1.8" --yes 2>$null
          gh release delete "windows-v0.1.9" --yes 2>$null
          gh release delete "windows-v0.1.10" --yes 2>$null
          gh release delete "windows-v0.1.11" --yes 2>$null
          gh release create "${{ github.ref_name }}" apps/windows/dist/*.exe --generate-notes --title "OpenCut AI Windows ${{ github.ref_name }}"
