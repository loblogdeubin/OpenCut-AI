name: Publish Windows Artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows Desktop Release run ID
        required: true
        type: string
      release_tag:
        description: Existing or new GitHub release tag
        required: true
        default: windows-v0.1.0
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful Windows executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.run_id }}" --name OpenCut-AI-Windows-x64 --dir release

      - name: Verify executables
        run: |
          test -f release/OpenCut-AI-Setup-0.1.0-x64.exe
          test -f release/OpenCut-AI-Portable-0.1.0-x64.exe
          sha256sum release/*.exe | tee release/SHA256SUMS.txt

      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "OpenCut AI Windows v0.1.0" --generate-notes
          gh release upload "$RELEASE_TAG" release/*.exe release/SHA256SUMS.txt --clobber
